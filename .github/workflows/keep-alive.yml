name: Render Keep-Alive (Never Sleep)

on:
  schedule:
    # Har 10 daqiqada ishga tushadi (Render 15 daqiqada uxlaydi)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Qo'lda ishga tushirish imkoniyati

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend URL
        run: |
          URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://educontrol-api.onrender.com"
          fi
          echo "Pinging $URL/api/health to keep Render awake..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/health" || echo "failed")
          echo "Render response HTTP status: $RESPONSE"
