version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: educontrol_postgres
    restart: always
    environment:
      POSTGRES_USER: educontrol
      POSTGRES_PASSWORD: educontrol_secret
      POSTGRES_DB: educontrol_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
